worker_processes auto;
pid /tmp/nginx.pid;
error_log /tmp/nginx_error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /tmp/nginx_access.log;

    # Temp directories writable by non-root user (UID 1000)
    client_body_temp_path /tmp/nginx_client_body 1 2;
    proxy_temp_path /tmp/nginx_proxy 1 2;
    fastcgi_temp_path /tmp/nginx_fastcgi 1 2;
    uwsgi_temp_path /tmp/nginx_uwsgi 1 2;
    scgi_temp_path /tmp/nginx_scgi 1 2;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # High body size for large PDF files and OCR processing
    client_max_body_size 500M;

    server {
        listen 7860 default_server;
        listen [::]:7860 default_server;
        server_name _;

        # Root Portal Dashboard
        location = / {
            root /app/portal;
            index index.html;
            try_files /index.html =404;
        }

        # Static assets for portal
        location /portal/ {
            alias /app/portal/;
            try_files $uri $uri/ =404;
        }

        # Stirling-PDF Reverse Proxy
        location /stirling {
            # Redirect /stirling to /stirling/
            rewrite ^/stirling$ /stirling/ permanent;

            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket Support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Generous timeouts for large PDF processing / OCR
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            send_timeout 600s;

            # Buffering adjustments for large streams
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # -------------------------------------------------------------
        # Template for Future Projects (e.g. Project 2 on port 8081)
        # Uncomment and configure when adding new tools:
        # -------------------------------------------------------------
        # location /tool2/ {
        #     proxy_pass http://127.0.0.1:8081/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        # }
    }
}

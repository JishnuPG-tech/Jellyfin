services:
  - type: web
    name: opencode-serve-lite
    env: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONMALLOC
        value: malloc
      - key: MALLOC_TRIM_THRESHOLD_
        value: 65536
      - key: API_SERVER_MODEL_NAME
        value: claude-haiku-4.5

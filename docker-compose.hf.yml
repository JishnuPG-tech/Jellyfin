version: '3.8'

services:
  hermes-agent:
    build:
      context: .
      dockerfile: Dockerfile.hf
    container_name: hermes-agent
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-sk-or-v1-your-key-here}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-123456789:ABCDEFGHIJxyz}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-fc-your-key-here}
      HERMES_HOME: /data
    volumes:
      - hermes_data:/data
    ports:
      - "7860:7860"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - hermes

volumes:
  hermes_data:
    driver: local

networks:
  hermes:
    driver: bridge

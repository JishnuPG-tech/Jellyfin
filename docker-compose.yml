version: "3.8"

services:
  opencode:
    build: .
    container_name: opencode-serve
    ports:
      - "7860:7860"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-password}
      - GITHUB_REPO=${GITHUB_REPO:-https://github.com/JishnuPG-tech/OpenCode-Drive.git}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - opencode-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:7860/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  opencode-data:

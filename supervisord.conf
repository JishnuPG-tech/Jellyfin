[supervisord]
nodaemon=true
user=stirlingpdfuser
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[program:nginx]
command=nginx -c /app/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:stirling-pdf]
command=/scripts/init.sh
directory=/app
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=SYSTEM_ROOTURIPATH="/stirling",SERVER_PORT="8080",HOME="/home/stirlingpdfuser",TMPDIR="/tmp/stirling-pdf",TEMP="/tmp/stirling-pdf",TMP="/tmp/stirling-pdf"

